name: Auto Publish YouTube Shorts

on:
  schedule:
    # Runs every 24 hours (once a day at 00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  publish_short:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg curl
        sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
        sudo chmod a+rx /usr/local/bin/yt-dlp

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Credentials
      env:
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      run: |
        mkdir -p credentials
        echo "$YOUTUBE_CLIENT_SECRET" > credentials/client_secret.json
        echo "$YOUTUBE_TOKEN_JSON" > credentials/youtube_token.json

    - name: Run Animation Pipeline
      env:
        YOUTUBE_UPLOAD_ENABLED: "true"
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: |
        python scripts/main.py

    - name: Commit and Push Updated History
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add output/history.json
        git commit -m "chore: update video processing history [skip ci]" || echo "No changes to commit"
        git push
