name: 🎬 Produce YouTube Short

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      niche:
        description: 'Niche to produce (ia_en_60_segundos, curiosidades, finanzas)'
        required: false
        default: 'ia_en_60_segundos'
      upload:
        description: 'Upload to YouTube? (true/false)'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: '3.12'

jobs:
  produce:
    name: 🚀 Generate & Upload Short
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --- Setup ---
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Verify FFmpeg
        run: ffmpeg -version | head -1

      - name: 🏗️ Setup environment
        run: python setup_env.py

      # --- Production ---
      - name: 🎬 Run production pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_UPLOAD_ENABLED: 'true'
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python scripts/main.py

      # --- Save artifacts ---
      - name: 📁 Upload video artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-video-${{ github.run_number }}
          path: |
            output/videos/*.mp4
            output/videos/*.json
            output/pipeline.log
          retention-days: 30

      # --- Commit history ---
      - name: 💾 Commit updated history
        if: success()
        run: |
          git config user.name "YouTube Bot"
          git config user.email "bot@youtube-automation.local"
          git add output/history.json || true
          git diff --cached --quiet || git commit -m "📊 Update production history [skip ci]"
          git push || true
