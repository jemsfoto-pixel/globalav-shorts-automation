name: 🎬 Produce YouTube Short

on:
  # Run every 24 hours (once a day at 00:00 UTC)
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      niche:
        description: 'Nicho a producir (Tecnología AV, Sonido, Calibración, Pantallas)'
        required: false
        default: 'tecnologia_av'
      upload:
        description: 'Upload to YouTube? (true/false)'
        required: false
        default: 'true'

env:
  PYTHON_VERSION: '3.12'
  PYTHONUNBUFFERED: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  produce:
    name: 🚀 Generate & Upload Short
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --- Setup ---
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Verify FFmpeg
        run: ffmpeg -version | head -1

      - name: 🏗️ Setup environment
        run: python setup_env.py

      # Cargar credenciales de YouTube a archivos
      - name: 🔑 Setup YouTube credentials
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          if [ -n "$YOUTUBE_CLIENT_SECRET" ]; then
            echo "$YOUTUBE_CLIENT_SECRET" > credentials/client_secret.json
          fi
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "$YOUTUBE_TOKEN_JSON" > credentials/youtube_token.json
          fi

      # Cargar cookies de YouTube desde el Secret para evitar bloqueo de bot detection
      - name: 🍪 Setup YouTube cookies for yt-dlp
        run: |
          mkdir -p credentials
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "${{ secrets.YOUTUBE_COOKIES }}" > credentials/cookies.txt
            echo "✅ Cookies cargadas correctamente."
          else
            echo "⚠️ Secret YOUTUBE_COOKIES no configurado. yt-dlp podría ser bloqueado por YouTube."
            touch credentials/cookies.txt
          fi

      # --- Production ---
      - name: 🎬 Run production pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_UPLOAD_ENABLED: 'true'
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python -u scripts/main.py

      # --- Save artifacts ---
      - name: 📁 Upload video artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-video-${{ github.run_number }}
          path: |
            output/videos/*.mp4
            output/videos/*.json
            output/pipeline.log
          retention-days: 30

      # --- Commit history ---
      - name: 💾 Commit updated history
        if: success()
        run: |
          git config user.name "YouTube Bot"
          git config user.email "bot@youtube-automation.local"
          git add output/history.json || true
          git diff --cached --quiet || git commit -m "📊 Update production history [skip ci]"
          git push || true
