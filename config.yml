# ============================================================
# YouTube Shorts Automation — GlobalAVInsights
# ============================================================

channel:
  name: "GlobalAVInsights"
  url: "https://www.youtube.com/@GlobalAVInsights"
  language: "es"

# --- Video Settings ---
video:
  width: 1080
  height: 1920
  fps: 30
  short_duration: 55   # Target Short duration (50-59s)
  format: "mp4"
  codec: "libx264"

# --- Subtitles ---
subtitles:
  font: "Montserrat-Bold"
  font_size: 80
  color: "#FFFFFF"
  highlight_color: "#FFD700"
  stroke_color: "#000000"
  stroke_width: 3
  position_y: 1400

# --- SEO ---
seo:
  max_title_chars: 50
  hashtags:
    - "#Shorts"
    - "#GlobalAVInsights"
    - "#HiFi"
    - "#Audio"
    - "#Calibración"
  category_id: "28"  # Science & Technology
  privacy: "public"

# --- Schedule ---
schedule:
  interval_hours: 0
  timezone: "Europe/Madrid"

# --- APIs ---
apis:
  youtube:
    credentials_dir: "credentials"
    env_var: "YOUTUBE_CLIENT_SECRET"

# --- Generation Settings ---
generator:
  enabled: true
  topics:
    # --- Español y Variados ---
    - "Monitores OLED vs IPS: ¿Cuál elegir en 2026?"
    - "Cómo calibrar tu TV para ver películas en 4K"
    - "Errores comunes al montar un Home Theater"
    - "Por qué el sonido de tu TV plana es tan malo (y cómo arreglarlo)"
    - "Proyectores vs TV Gigante para el salón"
    - "5 trucos para mejorar el sonido de tu oficina"
    - "Tecnología MicroLED explicada en 1 minuto"
    - "El mito de los cables de audio caros"
    - "HDR10 vs Dolby Vision: Batalla definitiva"
    - "Barras de sonido o altavoces dedicados: La verdad"
    - "Cómo afecta la acústica de tu sala al sonido"
    - "Hz y FPS: Guía rápida para monitores gaming"
    - "La configuración perfecta para hacer streaming"
    - "Conexiones HDMI 2.1: Por qué las necesitas"
